name: Verify HangulScript
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build:vscode
      - run: npm test
      - run: npm run build
      - run: npm run build:site
      - run: npm pack --dry-run
  editor-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: xvfb-run -a npm run test:vscode
  framework-examples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        framework: [react, vue]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/${{ matrix.framework }}-vite/package-lock.json
      - run: npm ci
        working-directory: examples/${{ matrix.framework }}-vite
      - run: npm run build
        working-directory: examples/${{ matrix.framework }}-vite
